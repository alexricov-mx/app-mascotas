# Entorno local de desarrollo de amiva.pet:
#   - postgres: PostgreSQL 18 + PostGIS 3.6, base amiva-dev (y base keycloak).
#   - keycloak: servidor de identidad, consola en http://localhost:8080
# Puerto local 5433 para no chocar con otros PostgreSQL del equipo (5432).
# Uso (desde esta carpeta):
#   1. Copiar .env.example a .env y ajustar las contraseñas.
#   2. podman compose up -d
#   3. podman compose ps        (debe aparecer "healthy")
# Detener: podman compose down   (los datos se conservan en el volumen)
# Borrar datos: podman compose down -v
# Solo para desarrollo local. Staging y producción (VPS) se configuran aparte.

name: amiva-dev

services:
  postgres:
    image: docker.io/postgis/postgis:18-3.6
    container_name: amiva-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amiva-dev
      POSTGRES_USER: ${POSTGRES_USER:-amiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env}
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # A partir de PostgreSQL 18 la imagen espera el volumen en /var/lib/postgresql.
      - amiva-dev-data:/var/lib/postgresql
      # Scripts que solo corren al crear el volumen por primera vez.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d amiva-dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: amiva-dev-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HEALTH_ENABLED: "true"
      TZ: America/Mexico_City
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  amiva-dev-data:
